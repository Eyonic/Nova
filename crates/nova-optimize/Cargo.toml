[package]
name = "nova-optimize"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
brotli = "9"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
nova-config = { version = "0.1.0", path = "../nova-config" }
notify = { version = "8", default-features = false }
oxc_allocator = "0.153.0"
oxc_codegen = "0.153.0"
oxc_minifier = "0.153.0"
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
ravif = "0.13.0"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
walkdir = "2.5.0"
webp = "0.3.1"
zstd = "0.14"
