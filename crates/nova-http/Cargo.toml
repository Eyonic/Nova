[package]
name = "nova-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-compression = { version = "0.4.50", features = ["tokio", "brotli", "zstd", "gzip"] }
bytes = "1.12.1"
futures-util = "0.3.34"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tracing = "0.1.44"
