[package]
name = "nova-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.190"
mimalloc = { version = "0.1", default-features = false }
nova-config = { version = "0.1.0", path = "../nova-config" }
nova-core = { version = "0.1.0", path = "../nova-core" }
nova-runtime-php = { version = "0.1.0", path = "../nova-runtime-php" }
nova-security = { version = "0.1.0", path = "../nova-security" }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
