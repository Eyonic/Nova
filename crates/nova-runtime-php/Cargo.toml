[package]
name = "nova-runtime-php"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
crc32fast = "1.5.2"
futures-util = "0.3.34"
http = "1.5.0"
libc = "0.2.190"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "fs", "macros", "signal"] }
tracing = "0.1.44"
