# NOVA platform configuration (schema version 1).
# Secrets never live here: `*_env` fields name environment variables.
version = 1
mode = "production"          # overridden by NOVA_MODE

[server]
listen = "0.0.0.0:8080"
shutdown_grace_secs = 20
max_request_body = "32MiB"
metrics = true
# Reverse proxies allowed to set the client address. List the proxies
# themselves, never whole networks: with Docker's port publishing every
# client can arrive from the bridge gateway (172.x), and trusting that range
# would let anyone forge X-Forwarded-For (and reach admin endpoints).
# Behind nginx/Traefik/a CDN on 10.0.0.5, for example:
#   trusted_proxies = ["10.0.0.5"]
#   forwarded_header = "x-forwarded-for"   # or "forwarded" (RFC 7239)
trusted_proxies = []

# HTTPS + HTTP/2 + HTTP/3. Local hosts get a persistent self-signed
# certificate; set acme = true and acme_email for Let's Encrypt on public hosts.
[server.tls]
enabled = true
listen = "0.0.0.0:8443"
public_port = 8443           # the host port in compose.yaml (443 in production)

[paths]
state_dir = "/var/lib/nova"
run_dir = "/run/nova"

[optimize]
enabled = true
widths = [320, 640, 960, 1280, 1920]
formats = ["avif", "webp"]
quality = { avif = 60, webp = 78, jpeg = 82 }
workers = 2
scan_interval_secs = 10
budget_bytes = "500KiB"

[services.database.main]
driver = "mariadb"
host = "db"
port = 3306

[[site]]
name = "example"
hosts = ["localhost", "example.localhost"]
default = true
path = "/srv/sites/example"

[site.php]
front_controller = "router.php"
max_children = 8
timeout_secs = 30

[site.database]
service = "main"
name = "nova_example"
user = "nova_example"
password_env = "NOVA_DB_EXAMPLE_PASSWORD"

[site.env]
APP_NAME = "NOVA Example"

[site.headers]
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[site.error_pages]
404 = "/404.html"

[[site.redirect]]
from = "/old-home"
to = "/"

[[site.redirect]]
from = "/docs/*"
to = "https://github.com/Eyonic/Nova/tree/main/docs/$1"
status = 302

[site.auth]
realm = "NOVA demo"
users_file = "/srv/sites/example/config/htpasswd"
paths = ["/private/**"]

# Background processes run as the site, inside its sandbox. For Laravel:
#   command = ["php", "artisan", "schedule:run"]   (task, every minute)
#   command = ["php", "artisan", "queue:work"]     (worker)
[[site.task]]
name = "heartbeat"
schedule = "* * * * *"
command = ["php", "-r", "file_put_contents(getenv('HOME') . '/tmp/task-ran', date('c'));"]

[[site.worker]]
name = "ticker"
command = ["php", "-r", "while (true) { file_put_contents(getenv('HOME') . '/tmp/worker-alive', getmypid()); sleep(2); }"]

[[site]]
name = "second"
hosts = ["second.localhost"]
path = "/srv/sites/second"

[site.php]
max_children = 4

[site.database]
service = "main"
name = "nova_second"
user = "nova_second"
password_env = "NOVA_DB_SECOND_PASSWORD"

# Demo site for trying NOVA in a browser: http://showcase.localhost:8088/
[[site]]
name = "showcase"
hosts = ["showcase.localhost"]
path = "/srv/sites/showcase"

[site.php]
max_children = 4
