worker_processes 4;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  sendfile on; tcp_nopush on; keepalive_requests 100000;
  gzip on; gzip_comp_level 5; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 256;
  open_file_cache max=10000 inactive=60s;
  ssl_certificate /certs/cert.pem; ssl_certificate_key /certs/key.pem; ssl_protocols TLSv1.3; ssl_session_cache shared:SSL:10m; quic_retry off; add_header Alt-Svc 'h3=":443"; ma=86400';
  upstream php { server php:9000; keepalive 32; }
  server {
    listen 80; listen 443 ssl; listen 443 quic reuseport; http2 on; server_name wp.nova.test;
    root /srv/sites/wordpress/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass php; fastcgi_keep_conn on; }
  }
  server {
    listen 80; listen 443 ssl; listen 443 quic; http2 on; server_name laravel.nova.test;
    root /srv/sites/laravel/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass php; fastcgi_keep_conn on; }
  }
  server {
    listen 80 default_server; listen 443 ssl default_server; listen 443 quic; http2 on; server_name static.test;
    root /srv/sites/example/public;
  }
}
