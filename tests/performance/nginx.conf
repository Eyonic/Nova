# Reference: stock nginx serving the same files, PHP through php-fpm on :9900.
worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  sendfile on; tcp_nopush on; keepalive_requests 100000;
  server {
    listen 9001;
    listen 9441 ssl;
    http2 on;
    ssl_certificate /conf/cert.pem; ssl_certificate_key /conf/key.pem;
    root /site/public;
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9900;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /site/public$fastcgi_script_name;
    }
  }
}
